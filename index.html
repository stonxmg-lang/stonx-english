.prog2{display:flex;align-items:center;gap:10px;margin-bottom:12px}.prog2 .bar{flex:1;height:10px;background:#22304d;border-radius:10px;overflow:hidden}.prog2 .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green))}.prog2 b{font-size:14px}

function hash(s){let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0}
function wpick(mix){const tot=mix.reduce((a,m)=>a+m[1],0);let r=rnd()*tot;for(const m of mix){if((r-=m[1])<0)return m[0]}return mix[0][0]}
function okQ(q){if(!q)return false;if(q.t=="order")return q.words&&q.words.length>1&&q.words.join(" ")==q.answer;return q.opts&&q.opts.length>=2&&new Set(q.opts).size==q.opts.length&&q.a>=0&&q.a<q.opts.length}
function genPool(u,n,seedTag,mix){rnd=R(hash(u.id+seedTag));const seen=new Set(),out=[];let g=0;while(out.length<n&&g++<n*80){let q;try{q=wpick(mix)()}catch(e){continue}if(!okQ(q)||seen.has(q.key))continue;seen.add(q.key);out.push(q)}return out}
const CACHE={};
function unitData(u){if(CACHE[u.id])return CACHE[u.id];
 const prac=genPool(u,NPRAC,"p",u.gens);prac.forEach((q,i)=>{q.id=u.id+"-p"+i;q.unit=u.id;BANK[q.id]=q});
 // listening derived from practice + unit listen gens
 rnd=R(hash(u.id+"l"));const lis=[],ls=new Set();const add=q=>{if(q&&okQ(q)&&!ls.has(q.key)){ls.add(q.key);lis.push(q)}};
 for(const q of prac)if(q.audio&&lis.length<NLIS)add({...q,key:"lx|"+q.key});
 const src=shuf(prac.slice());
 for(const q of src){if(lis.length>=NLIS)break;const sent=q.en&&/[.?!]$/.test(q.en)&&!q.en.includes(" — ")&&q.en.split(" ").length<=14;if(!sent)continue;const r=rnd();
  if(q.t=="order"||r<.25){const w=q.en.replace(/[.?!]$/,"").split(" ");if(w.length>1&&w.length<=10)add({t:"order",label:"Listen and build the sentence",color:"var(--rose)",audio:q.en,words:w,answer:w.join(" "),en:q.en,ar:q.ar,exp:"",expAr:"",key:"ld|"+q.en});}
  else if(q.t=="fill"&&!q.audio)add({...q,audio:q.en,label:"Listen and complete",color:"var(--rose)",key:"lf|"+q.key});
  else if((q.t=="correct"||q.t=="ar2en")&&q.opts.every(o=>/[a-z]/i.test(o)))add({...q,t:"listen",audio:q.en,label:"What do you hear?",prompt:"Listen and choose the sentence you hear.",arq:0,key:"lh|"+q.key});
  else if(q.t=="short"||q.t=="dlg"||q.t=="wha")add({...q,audio:q.prompt.replace(/<br>.*$/,"").replace(/<[^>]+>/g,"").replace(/^— /,""),label:"Listen and answer",prompt:q.prompt.includes("mk")?q.prompt.replace(/^[^<]*/,"🎧 "):"🎧 Listen and choose the answer.",color:"var(--rose)",key:"la|"+q.key})}
 if(u.lgens){for(let i=0;i<200&&lis.length<NLIS;i++)add(wpick(u.lgens)())}
 lis.forEach((q,i)=>{q.id=u.id+"-l"+i;q.unit=u.id;BANK[q.id]=q});
 const speak=[];u.learn.forEach(s=>s.ex.forEach(([e,a])=>{if(u.id=="u29"&&s.h.startsWith("a / an"))return;e.split(" — ").forEach((x,i)=>speak.push({en:x.replace(/^[✗✓] /,""),ar:i==0?a.split(" — ")[0]:(a.split(" — ")[1]||"")}))}));
 (u.qa||[]).forEach(([q,m])=>speak.push({en:q,model:m,ask:1,ar:""}));
 u.words.filter(w=>w[2]).forEach(w=>speak.push({en:w[2],ar:w[3]}));
 CACHE[u.id]={prac,lis,speak};return CACHE[u.id]}
function unitTest(u){const d=unitData(u);rnd=R(Date.now()%1e9);const fresh=genPool(u,40,"t"+Date.now(),u.gens);return shuf(fresh).slice(0,16).concat(shuf(d.lis).slice(0,4)).map((q,i)=>{q.id=q.id||u.id+"-t"+i;return q})}

const STEPS=[["learn","📘","Learn","الشرح"],["words","🧠","Words","الكلمات"],["prac","✍️","Practice","التمارين"],["listen","🎧","Listen","الاستماع"],["speak","🎤","Speak","المحادثة"],["rw","📖","Read & Write","القراءة والكتابة"],["test","🏁","Unit test","اختبار الوحدة"]];
function stepDone(u,s){if(s=="prac"){let n=0;for(let i=0;i<NPRAC/SET;i++)if(P[u.id+":p"+i])n++;return n>=Math.min(3,Math.ceil(unitData(u).prac.length/SET))}if(s=="listen"){if(!unitData(u).lis.length)return true;for(let i=0;i<NLIS/SET;i++)if(P[u.id+":l"+i])return true;return false}if(s=="rw")return !u.read&&!u.write||!!P[u.id+":rw"];return !!P[u.id+":"+s]}
const stepsOf=u=>STEPS.filter(s=>s[0]!="rw"||u.read||u.write);
function unitPct(u){const S=stepsOf(u);return S.filter(s=>stepDone(u,s[0])).length/S.length}
function nextStep(){for(const u of A1)for(const s of stepsOf(u))if(!stepDone(u,s[0]))return[u,s];return null}

function colorize(t){return String(t).split(" ").map(w=>{const m=w.match(/^([^.,!?—]*)([.,!?—]*)$/);if(!m)return w;let x=m[1],p=m[2];const l=x.toLowerCase();

 else if(l=="am")x=`<span class="w-am">${x}</span>`;else if(l=="is")x=`<span class="w-is">${x}</span>`;else if(l=="are")x=`<span class="w-are">${x}</span>`;else if(["was","were","did"].includes(l))x=`<span class="w-was">${x}</span>`;else if(["do","does","can"].includes(l))x=`<span class="w-do">${x}</span>`;

function startPrac(id,i){const d=unitData(U(id));begin(d.prac.slice(i*SET,i*SET+SET),{type:"set",key:id+":p"+i,title:`${U(id).t} · Set ${i+1}`,uid:id,i,step:"prac"})}
function listenHTML(id){const u=U(id);const d=unitData(u);const n=Math.ceil(d.lis.length/SET);return hdr("🎧 Listen · "+u.t,`${d.lis.length} questions`,"var(--rose)")+`<div class="card"><p>Tap ▶ to hear again, 🐢 for slow.</p><p class="ar">استمع أولاً بدون النظر للخيارات، ثم اختر.</p></div><div class="sets" style="display:grid">${Array.from({length:n},(_,i)=>`<button class="set s${P[id+":l"+i]||0}" onclick="startLis('${id}',${i})">${i+1}<small>${"★".repeat(P[id+":l"+i]||0)}</small></button>`).join("")}</div><div class="dbtn"><button onclick="openStep('${id}','speak')">Next: 🎤 Speak →</button></div>`}
function startLis(id,i){const d=unitData(U(id));begin(d.lis.slice(i*SET,i*SET+SET),{type:"set",key:id+":l"+i,title:`${U(id).t} · Listening ${i+1}`,uid:id,i,step:"listen"})}
function rwHTML(id){const u=U(id);return hdr("📖 Read & Write · "+u.t,"القراءة والكتابة","var(--green)")+`<div class="list2">${(u.read||[]).map((r,i)=>`<button class="row2" onclick="startRead('${id}',${i})"><span class="n ${P[id+":r"+i]?"ok":""}">📖</span><div><b>${r.title}</b><small>${r.s.length} sentences · ${r.q.length} questions</small></div><span class="go">›</span></button>`).join("")}
 ${u.write?`<button class="row2" onclick="go('write:${id}')"><span class="n ${P[id+":w"]?"ok":""}">✏️</span><div><b>Writing: ${u.write.title}</b><span class="ar">${u.write.ar}</span><small>model · order the paragraph · your turn</small></div><span class="go">›</span></button>`:""}</div><div class="dbtn"><button class="p" onclick="openStep('${id}','test')">Next: 🏁 Unit test →</button></div>`}
function startRead(id,i){const u=U(id),r=u.read[i];const ps={title:r.title,html:r.s.map(x=>x[0]).join(" "),ar:r.s.map(x=>x[1]).join(" ")};rnd=R(Date.now()%1e9);
 const qs=r.q.map((q,k)=>{const opts=shuf(q.slice(1,5));return{t:"read",label:"Reading",color:"var(--green)",prompt:q[0],opts,a:opts.indexOf(q[1]),en:q[1],ar:null,exp:"",expAr:"",passage:ps,id:id+"-r"+i+"-"+k}});qs.forEach(q=>BANK[q.id]=q);
 begin(qs,{type:"set",key:id+":r"+i,title:"Reading: "+r.title,uid:id,step:"rw"})}
function writeView(id){const u=U(id),w=u.write;$("view").innerHTML=hdr("✏️ "+w.title,w.ar,"var(--green)")+`<h3>1. Read the model <button class="pill sm" onclick="speak('${esc(w.model.map(x=>x[0]).join(" "))}')">▶ Listen</button></h3><div class="exs">${w.model.map(([e,a])=>`<div class="ex" onclick="speak('${esc(e)}')"><div><div class="en">${colorize(e)}</div><div class="ar">${a}</div></div></div>`).join("")}</div>
 <h3>2. Put the paragraph in order</h3><div class="dbtn"><button class="p" onclick="orderPara('${id}')">Start ✍️</button></div>
 <h3>3. Your turn — write about yourself</h3><div class="card"><p class="ar">اكتب فقرة مثل النموذج عن نفسك. استخدم نفس الجمل وغيّر المعلومات. اقرأها بصوت عالٍ بعد الكتابة.</p><textarea id="wt" placeholder="Write here…">${LS.get("a1_w_"+id,"")}</textarea><div class="dbtn row"><button onclick="LS.set('a1_w_${id}',$('wt').value);mark('${id}:w');mark('${id}:rw');toast('Saved ✓')">💾 Save</button><button onclick="speak($('wt').value)">🔊 Read it to me</button></div>
 <p class="chk">✓ Capital letter at the start · ✓ full stop (.) at the end · ✓ a verb in every sentence (am/is/are or another verb) · ✓ at least 5 sentences</p></div>`}
function orderPara(id){const w=U(id).write;const q={t:"order",para:1,label:"Put the paragraph in order",color:"var(--green)",words:w.model.map(x=>x[0]),answer:w.model.map(x=>x[0]).join(" "),en:w.model.map(x=>x[0]).join(" "),ar:null,exp:"",expAr:"",id:id+"-wp"};BANK[q.id]=q;begin([q],{type:"set",key:id+":w",title:w.title,uid:id,step:"rw"})}
function irrHTML(){return hdr("🔀 Irregular verbs","الأفعال الشاذة — "+IRR.length,"var(--purple)")+`<div class="card"><p class="ar">اضغط على السطر لتسمع الفعل وماضيه. احفظ 10 أفعال يومياً.</p></div><table class="tb">${IRR.map(v=>`<tr onclick="speak('${esc(v[0]+", "+v[1].replace(" / ",", "))}')"><td>${v[0]}</td><td style="color:var(--purple)">${v[1]}</td><td class="ar">${v[2]}</td></tr>`).join("")}</table><div class="dbtn"><button class="p" onclick="openStep('u25','prac')">✍️ Practise irregular verbs</button></div>`}
function dictHTML(){const all=[];A1.forEach(u=>u.words.forEach(w=>all.push([w[0],w[1],u])));return hdr("🔎 Dictionary","كل كلمات A1","var(--gold)")+`<input id="dq" class="search" placeholder="Search English or Arabic…" oninput="dictSearch()"><div id="dr" class="exs"></div>`}
function dictSearch(){const q=$("dq").value.trim().toLowerCase();const all=[];A1.forEach(u=>u.words.forEach(w=>all.push([w[0],w[1],u])));const r=q?all.filter(x=>x[0].toLowerCase().includes(q)||x[1].includes(q)).slice(0,80):[];$("dr").innerHTML=r.map(x=>`<div class="ex" onclick="speak('${esc(x[0].replace(/ → /g,", "))}')"><div><div class="en"><b>${x[0]}</b> <span class="ar wm">${x[1]}</span></div><small style="color:var(--mu)">Unit ${A1.indexOf(x[2])+1}: ${x[2].t}</small></div><span class="spk">🔊</span></div>`).join("")||(q?`<p class="sub">No results.</p>`:"")}
function planHTML(){return hdr("📅 Study plan","كيف تذاكر","var(--blue)")+`<div class="card"><p class="ar"><b>كل يوم (45–60 دقيقة):</b></p><p class="ar">١. ادخل الوحدة التي أخذها المدرس اليوم (أو التالية في الترتيب).</p><p class="ar">٢. اقرأ الشرح 📘 واضغط Play all لتسمع الأمثلة.</p><p class="ar">٣. احفظ الكلمات 🧠 بالبطاقات ثم حل اختبار الكلمات.</p><p class="ar">٤. حل 3 مجموعات تمارين ✍️ على الأقل.</p><p class="ar">٥. مجموعة استماع 🎧 ثم كرّر الجمل بصوتك 🎤.</p><p class="ar">٦. اقرأ النص واكتب الفقرة ✏️ إن وجدت.</p><p class="ar">٧. اختبار الوحدة 🏁 — انجح بـ 70% ثم انتقل.</p><p class="ar"><b>كل أسبوع:</b> افتح «My mistakes» وراجع أخطاءك حتى تصبح صفراً.</p><p class="ar"><b>في النهاية:</b> امتحان A1 النهائي — 60 سؤالاً من كل الوحدات.</p></div>`}
/* ---------- speaking ---------- */
const REC=window.SpeechRecognition||window.webkitSpeechRecognition;
function norm(t){return t.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]/g," ").replace(/\bi am\b/g,"i'm").replace(/\byou are\b/g,"you're").replace(/\b(he|she|it|that|what|where|there) is\b/g,"$1's").replace(/\bwe are\b/g,"we're").replace(/\bthey are\b/g,"they're").replace(/\bis not\b/g,"isn't").replace(/\bare not\b/g,"aren't").replace(/\bdo not\b/g,"don't").replace(/\bdoes not\b/g,"doesn't").replace(/\bdid not\b/g,"didn't").replace(/\bcannot\b/g,"can't").split(/\s+/).filter(Boolean)}
function speakView(id){const u=U(id),items=unitData(u).speak;let k=0,good=0;$("view").innerHTML=hdr("🎤 Speak · "+u.t,`${items.length} sentences`,"var(--blue)")+`<div id="spk"></div>`;
 const draw=()=>{if(k>=items.length){mark(id+":speak");$("spk").innerHTML=`<div class="done"><div class="score">🎉</div><p>${items.length} sentences done${REC?` · ${good} checked ✓`:""}</p><div class="dbtn"><button class="p" onclick="openStep('${id}','rw')">Next →</button><button onclick="go('speak:${id}',false)">Again</button></div></div>`;return}
  const it=items[k];$("spk").innerHTML=`<div class="counter2">${k+1} / ${items.length} <button class="pill sm" onclick="window._spSkip()">Finish ⏭</button></div><div class="fcard sp">${it.ask?`<small>Answer the question:</small>`:`<small>Say:</small>`}<div class="big3">${colorize(it.en)}</div><div class="ar">${it.ar||""}</div>${it.model?`<div class="model">Example answer: <b>${it.model}</b></div>`:""}<div id="heard"></div></div>
  <div class="dbtn row"><button onclick="speak('${esc(it.en)}')">🔊 Listen</button><button onclick="speak('${esc(it.en)}',null,.6)">🐢 Slow</button></div>
  <button class="mic" id="mic">${REC?"🎤 Tap and speak":"🎤 Mic check needs Chrome"}</button>
  <div class="dbtn row"><button onclick="window._spPrev()">← Back</button><button class="p" onclick="window._spNext()">Next →</button></div>`;
  $("mic").onclick=()=>{if(!REC){toast("Use Chrome on Android for the mic");return}try{speechSynthesis.cancel()}catch(e){}const r=new REC();r.lang="en-US";r.maxAlternatives=3;$("mic").textContent="🔴 Listening…";$("mic").classList.add("on");
   r.onresult=e=>{const alts=[...e.results[0]].map(a=>a.transcript);if(it.ask){const ok=norm(alts[0]).length>=3;if(ok)good++;$("heard").innerHTML=`<div class="res ${ok?"g":"b"}">You said: “${alts[0]}”<br>${ok?"✓ Good!":"Try a full sentence."}</div>`;return}
    const target=norm(it.en);let best=0,bt=alts[0];for(const a of alts){const g=norm(a);const h=target.filter(w=>g.includes(w)).length/target.length;if(h>best){best=h;bt=a}}const got=norm(bt);const ok=best>=.8;if(ok){good++;speak("Great!")}
    $("heard").innerHTML=`<div class="res ${ok?"g":"b"}">${Math.round(best*100)}% — ${ok?"✓ Great!":"Try again"}<br><small>You said: “${bt}”</small><div class="words">${target.map(w=>`<span class="${got.includes(w)?"hit":"miss"}">${w}</span>`).join(" ")}</div></div>`};
   r.onerror=e=>{$("heard").innerHTML=`<div class="res b">${e.error=="not-allowed"?"Allow the microphone, please.":e.error=="network"?"The mic check needs internet.":"I didn't hear you. Try again."}</div>`};r.onend=()=>{const m=$("mic");if(m){m.textContent="🎤 Tap and speak";m.classList.remove("on")}};r.start()};speak(it.en)};
 window._spNext=()=>{k++;draw()};window._spPrev=()=>{if(k>0){k--;draw()}};window._spSkip=()=>{k=items.length;draw()};draw()}
/* ---------- quiz engine ---------- */
function mistakes(){const q=[...mis].map(id=>BANK[id]).filter(Boolean);if(!q.length){if(mis.size){A1.forEach(unitData);return mistakes()}toast("No mistakes to review 👍");return}rnd=R(Date.now()%1e9);begin(shuf(q).slice(0,20),{type:"mis",title:"My mistakes"})}
function finalExam(){rnd=R(Date.now()%1e9);const qs=[];A1.forEach(u=>{const d=unitData(u);shuf(d.prac).slice(0,2).forEach(q=>qs.push(q))});A1.slice(0,4).forEach(u=>qs.push(pick(unitData(u).lis)));begin(shuf(qs).slice(0,60),{type:"final",title:"Final A1 exam"})}
function begin(qs,meta){run={qs,meta,i:0,cor:0,wrong:[]};page="quiz";history.pushState(null,"","#quiz");document.body.classList.add("inquiz");scrollTo(0,0);show()}
function exitQuiz(){run=null;$("fb").classList.remove("on");try{speechSynthesis.cancel()}catch(e){}back()}
function show(){answered=false;cur=run.qs[run.i];$("fb").classList.remove("on");const q=cur;let h=`<div class="qtype" style="color:${q.color||"var(--blue)"}">${q.label||""}</div>`;
 if(q.passage)h+=`<details class="passage" ${run.i==0?"open":""}><summary>📖 ${q.passage.title} <small>(tap to ${run.i==0?"hide":"show"})</small></summary><p>${colorize(q.passage.html)}</p><details class="tr"><summary class="ar">الترجمة</summary><p class="ar">${q.passage.ar}</p></details></details>`;
 if(q.audio)h+=`<div class="play"><button class="pbig" onclick="speak('${esc(q.audio)}')">▶ Play</button><button class="pslow" onclick="speak('${esc(q.audio)}',null,.6)">🐢</button></div>`;
 if(q.t=="order"){const tiles=shuf(q.words.map((w,i)=>({w,i})));h+=`<div class="hint">${q.audio?"Listen, then tap the words in order.":q.para?"Tap the sentences in the right order.":"Tap the words in the right order."}</div><div class="slot ${q.para?"para":""}" id="slot"></div><div class="pool ${q.para?"para":""}" id="pool">${tiles.map(t=>`<button class="tile" onclick="tap(this)">${t.w}</button>`).join("")}</div><button class="check" id="chk" disabled onclick="checkOrder()">Check</button>`}
 else{const showPrompt=q.audio&&q.t!="fill"?`<span style="font-size:16px;color:var(--mu)">${q.prompt}</span>`:q.prompt;h+=`<div class="prompt ${q.arq?"ar arq":""}">${showPrompt}</div>${q.hint?`<div class="hint ${/[\u0600-\u06FF]/.test(q.hint)?"ar":""}">${q.hint}</div>`:'<div class="hint"></div>'}<div class="opts ${q.grid?"grid":""}">${q.opts.map((o,i)=>`<button class="opt ${q.arOpts?"arx":""}" onclick="choose(${i},this)">${o}</button>`).join("")}</div>`}
 $("view").innerHTML=`<div class="qtop"><button class="x" onclick="exitQuiz()">✕</button><div class="qbar"><i style="width:${run.i/run.qs.length*100}%"></i></div><span class="qn">${run.i+1} / ${run.qs.length}</span></div>`+h;if(q.audio)setTimeout(()=>speak(q.audio),250)}
let orderSel=[];
function tap(b){if(answered)return;b.classList.add("used");const s=document.createElement("button");s.className="tile";s.textContent=b.textContent;s.onclick=()=>{if(answered)return;s.remove();b.classList.remove("used");orderSel=orderSel.filter(x=>x!==b);$("chk").disabled=orderSel.length!=cur.words.length};$("slot").appendChild(s);orderSel.push(b);$("chk").disabled=orderSel.length!=cur.words.length}
function checkOrder(){if(answered)return;const got=[...$("slot").children].map(x=>x.textContent).join(" ");const ok=got==cur.answer;$("slot").classList.add(ok?"ok":"no");orderSel=[];result(ok)}
function choose(i,b){if(answered)return;const ok=i==cur.a;document.querySelectorAll(".opt").forEach((x,j)=>{x.disabled=true;if(j==cur.a)x.classList.add("ok")});if(!ok)b.classList.add("no");result(ok)}
function result(ok){answered=true;st.ans++;if(ok){st.cor++;run.cor++;if(run.meta.type=="mis")mis.delete(cur.id)}else{if(cur.id)mis.add(cur.id);run.wrong.push(cur)}save();
 const fb=$("fb");fb.className="fb on "+(ok?"good":"bad");$("fbt").textContent=ok?pick(["Correct! ✓","Great! ✓","Well done! ✓","Perfect! ✓"]):"Not quite ✗";
 const ans=cur.t=="read"?cur.opts[cur.a]:cur.para?cur.words.join("<br>"):cur.en;$("fbs").innerHTML=cur.t=="wrong"?"":colorize(ans);$("fba").textContent=cur.ar||"";
 $("fbe").innerHTML=(cur.exp||"")+(cur.expAr?`<span class="ar">${cur.expAr}</span>`:"");if(ok&&!cur.para)speak(cur.t=="read"?cur.opts[cur.a]:cur.en)}
function nextQ(){$("fb").classList.remove("on");run.i++;if(run.i>=run.qs.length)finish();else{show();scrollTo(0,0)}}
function finish(){const n=run.qs.length,c=run.cor,pct=Math.round(c/n*100),s=pct>=90?3:pct>=70?2:pct>=50?1:0;const m=run.meta;let msg="",next="";
 if(m.type=="set"){mark(m.key,s);if(m.step=="words"&&s)mark(m.uid+":words");if(m.step=="rw"&&s)mark(m.uid+":rw");}
 if(m.type=="test"){P[m.key+":tests"]=Math.max(P[m.key+":tests"]||0,pct);if(pct>=70)mark(m.key+":test");save();msg=pct>=70?"✅ Unit passed!":"Not yet — you need 70%. Review and try again."}
 if(m.type=="final"){P.final=Math.max(P.final||0,pct);save();msg=pct>=70?"🏆 You passed A1!":"Keep going — review your weak units and try again."}
 if(m.uid){const u=U(m.uid),i=A1.indexOf(u);if(m.step=="prac"&&m.i+1<NPRAC/SET)next=`<button class="p" onclick="startPrac('${m.uid}',${m.i+1})">Next set →</button>`;else if(m.step=="listen"&&m.i+1<NLIS/SET)next=`<button class="p" onclick="startLis('${m.uid}',${m.i+1})">Next set →</button>`;else if(m.type=="test"&&pct>=70&&A1[i+1])next=`<button class="p" onclick="go('unit:${A1[i+1].id}')">Unit ${i+2}: ${A1[i+1].t} →</button>`;
  next+=`<button onclick="run=null;go('unit:${m.uid}')">Back to unit ${i+1}</button>`}
 $("view").innerHTML=`<div class="done"><div style="color:var(--mu);font-weight:700">${m.title}</div><div class="score">${c}/${n}</div><div class="stars">${"★".repeat(s)}<i>${"★".repeat(3-s)}</i></div><p>${msg||(s==3?"Excellent!":s==2?"Very good!":s==1?"Good — try again for more stars.":"Keep practising — try again!")}</p>
 <div class="dbtn">${next}${run.wrong.length?`<button onclick="begin(run.wrong.slice(),{type:'retry',title:'Retry mistakes',uid:'${m.uid||""}'})">↺ Retry my ${run.wrong.length} mistake${run.wrong.length>1?"s":""}</button>`:""}<button onclick="run=null;go('home')">⌂ Home</button></div></div>`;if(s>=2)speak(s==3?"Excellent!":"Very good!")}
/* ---------- misc ---------- */
let voice=null;function loadV(){try{const v=speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang));voice=v.find(x=>/en-US/i.test(x.lang)&&/female|samantha|google/i.test(x.name))||v.find(x=>/en-US/i.test(x.lang))||v[0]}catch(e){}}
if("speechSynthesis" in window){loadV();speechSynthesis.onvoiceschanged=loadV}
function speak(t,onend,rate){if(!t||!("speechSynthesis" in window)){onend&&onend();return}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t).replace(/<[^>]+>/g,"").replace(/[✗✓→🔢🕐📅🎧—]/g," ").replace(/…/g,"").replace(/___/g,"blank"));u.lang="en-US";if(voice)u.voice=voice;u.rate=rate||.9;if(onend)u.onend=onend;speechSynthesis.speak(u)}catch(e){onend&&onend()}}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1800)}
async function share(){const url=location.href.split("#")[0];try{if(navigator.share){await navigator.share({title:"STONX English A1",text:"Free complete A1 English course — 29 units",url});return}}catch(e){return}try{await navigator.clipboard.writeText(url)}catch(e){}toast("Link copied ✓")}
page=(location.hash.slice(1)||"home");if(page=="quiz")page="home";render();

</script>
