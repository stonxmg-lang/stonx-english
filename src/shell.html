<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090f1e">
<title>English A1 — Complete Beginner Course | STONX</title>
<meta name="description" content="A complete A1 English course: 29 units with grammar, vocabulary, reading, listening, speaking and writing. Thousands of tap-only practice questions with Arabic help.">
<meta property="og:title" content="English A1 — Complete course | STONX">
<meta property="og:description" content="29 units · grammar · vocabulary · reading · listening · speaking · writing">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#090f1e;--bg2:#111c34;--card:#16223a;--card2:#1e2c48;--line:#2a3a5c;--tx:#f1f5f9;--mu:#94a3b8;--blue:#38bdf8;--green:#4ade80;--gold:#facc15;--purple:#c084fc;--rose:#fb7185;--red:#f87171}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:linear-gradient(180deg,var(--bg1),var(--bg2)) fixed;color:var(--tx);font-family:Poppins,system-ui,sans-serif}
button{font-family:inherit}
.ar{font-family:Tajawal,system-ui,sans-serif;direction:rtl;unicode-bidi:isolate}
.wrap{max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(60px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{font:700 13px Poppins;letter-spacing:3px;color:#475569}
.pill{background:none;border:1.5px solid #334155;color:var(--tx);border-radius:99px;padding:7px 14px;font-weight:700;font-size:13px;cursor:pointer}.pill.sm{padding:4px 10px;font-size:11px;margin-left:6px;vertical-align:2px}
h1{font-size:32px;font-weight:800;margin:16px 0 4px;line-height:1.15}
h1 .am,.w-am{color:var(--blue)}h1 .is,.w-is{color:var(--green)}h1 .are,.w-are{color:var(--gold)}.w-not{color:var(--red)}.w-was{color:var(--purple)}
.sub{color:var(--mu);font-size:14px;margin:0 0 16px;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--card);border-radius:16px;padding:12px;text-align:center}.stat b{display:block;font-size:22px}.stat small{color:var(--mu);font-size:11px}
.big{display:flex;gap:10px;margin-bottom:16px}
.big button{flex:1;border:0;border-radius:16px;padding:13px 8px;font-weight:800;font-size:14px;cursor:pointer;color:#04121f;background:var(--blue)}
.big button.alt{background:var(--card2);color:var(--tx)}.big button small{display:block;font-weight:600;font-size:10.5px;opacity:.75}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile2{background:var(--card);border:0;border-top:4px solid var(--c);border-radius:20px;padding:16px 14px;text-align:left;color:var(--tx);cursor:pointer;display:flex;flex-direction:column;gap:2px}
.tile2 .ti{font-size:28px}.tile2 b{font-size:18px;margin-top:4px}.tile2 .ar{font-size:15px;color:var(--mu);text-align:left}.tile2 small{color:var(--mu);font-size:11.5px;margin-top:4px}
.tile2:active,.row2:active,.ex:active{transform:scale(.98)}
.plan{background:var(--card);border-radius:18px;padding:14px;margin-top:14px;font-size:13px;line-height:1.9}.plan .ar{display:block;color:var(--mu);font-size:15px}
.bar2{display:flex;align-items:center;gap:12px;margin-bottom:14px}.bar2 b{display:block;font-size:19px;line-height:1.25}.bar2 small{color:var(--mu);font-size:13px;font-family:Tajawal}
.x{flex:none;background:var(--card);border:0;color:var(--tx);width:42px;height:42px;border-radius:12px;font-size:19px;cursor:pointer}
.list2{display:flex;flex-direction:column;gap:10px}
.row2{display:flex;align-items:center;gap:12px;background:var(--card);border:0;border-radius:18px;padding:13px;color:var(--tx);text-align:left;cursor:pointer;width:100%}
.row2 b{display:block;font-size:15px}.row2 .ar{display:block;color:var(--mu);font-size:14px;text-align:left}.row2 small{color:#64748b;font-size:11.5px}.row2>div{flex:1;min-width:0}
.n{flex:none;width:42px;height:42px;border-radius:12px;background:#0e1a30;display:grid;place-items:center;font-weight:800;color:var(--blue);font-size:15px}.n.ok{background:var(--green);color:#052e16;font-size:12px}
.go{color:var(--mu);font-size:22px}
.card{background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:12px;font-size:15px;line-height:1.7}.card p{margin:4px 0}.card .ar{display:block;font-size:16px;color:#cbd5e1}
.tb{width:100%;border-collapse:separate;border-spacing:0 6px;margin-bottom:6px}.tb td{background:var(--card);padding:9px 10px;font-size:14.5px}.tb td:first-child{border-radius:12px 0 0 12px;font-weight:700}.tb td:last-child{border-radius:0 12px 12px 0}.tb td.ar{text-align:right;color:#cbd5e1;font-size:15px}
.spk{background:#ffffff12;border:0;color:var(--tx);border-radius:10px;padding:5px 8px;font-size:14px;cursor:pointer;flex:none}.spk.s{padding:2px 5px;font-size:11px;margin-left:4px}
h2{font-size:14px;color:var(--mu);margin:20px 0 10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}.cnt{background:var(--card2);border-radius:99px;padding:1px 8px;font-size:11px;margin-left:4px}
.exs{display:flex;flex-direction:column;gap:8px}
.ex{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:11px 13px;cursor:pointer;transition:background .2s}.ex>div{flex:1}.ex.hl{background:#1c3a5c}
.ex .en{font-size:16.5px;font-weight:600;line-height:1.45}.ex .en.sm{font-size:15px;font-weight:500;margin-top:2px}.ex .ar{font-size:16px;color:var(--mu);text-align:right;margin-top:3px;display:block}
.ex .ar.wm{display:inline-block;margin:0 0 0 8px;color:var(--gold);font-size:16px}
.tips{background:#2a2410;border:1px solid #554614;border-radius:16px;padding:10px 14px;margin-top:14px;font-size:14px;line-height:1.7}.tips p{margin:5px 0}.tips .ar{font-size:15px}
.dbtn{display:flex;flex-direction:column;gap:10px;margin-top:18px}.dbtn.row{flex-direction:row}.dbtn.row button{flex:1}
.dbtn button{border:0;border-radius:16px;padding:14px 10px;font-size:15px;font-weight:800;cursor:pointer;background:var(--card2);color:var(--tx)}
.dbtn button.p{background:var(--blue);color:#04121f}.dbtn button.ok2{background:var(--green);color:#052e16}.dbtn button.no2{background:#5f1d1d}
.unit{background:var(--card);border-radius:20px;margin-bottom:12px;overflow:hidden;border:2px solid transparent}
.uh{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer;width:100%;background:none;border:0;color:inherit;text-align:left}
.ui{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:18px;color:#04121f}
.um{flex:1;min-width:0}.um b{display:block;font-size:16px}.um small{color:var(--mu);font-size:12px}
.ubar{height:6px;background:#22304d;border-radius:6px;margin-top:7px;overflow:hidden}.ubar i{display:block;height:100%;border-radius:6px}
.sets{display:none;grid-template-columns:repeat(5,1fr);gap:8px;padding:0 14px 14px}.unit.open .sets{display:grid}
.set{border:0;border-radius:12px;background:var(--card2);color:var(--tx);padding:9px 0 7px;cursor:pointer;font-weight:700;font-size:15px}
.set small{display:block;font-size:10px;letter-spacing:1px;color:#475569;height:12px}.set.s1 small,.set.s2 small,.set.s3 small{color:var(--gold)}.set.s3{box-shadow:inset 0 0 0 2px var(--gold)}
.counter2{text-align:center;color:var(--mu);font-weight:700;margin:6px 0 10px}
.fcard{background:var(--card);border-radius:24px;min-height:240px;padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;text-align:center;cursor:pointer;border:2px solid var(--line)}
.fcard small{color:var(--mu)}.big2{font-size:38px;font-weight:800}.big3{font-size:26px;font-weight:700;line-height:1.4}.fcard .en{font-size:19px}.fcard .ar{font-size:19px;color:#cbd5e1}.fcard.sp{cursor:default}
.model{font-size:15px;color:var(--mu)}.model b{color:var(--tx)}
.mic{width:100%;margin-top:12px;border:0;border-radius:18px;padding:18px;font-size:19px;font-weight:800;background:linear-gradient(90deg,#2563eb,#7c3aed);color:#fff;cursor:pointer}.mic.on{background:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.res{margin-top:10px;border-radius:14px;padding:10px 12px;font-size:15px;line-height:1.6}.res.g{background:#0f2e1c;color:var(--green)}.res.b{background:#2e1214;color:var(--red)}.res small{color:var(--mu)}
.words{margin-top:6px}.words .hit{color:var(--green);font-weight:700}.words .miss{color:var(--red);text-decoration:underline}
/* quiz */
.qtop{display:flex;align-items:center;gap:10px}
.qbar{flex:1;height:10px;background:#22304d;border-radius:10px;overflow:hidden}.qbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green));transition:.3s}
.qn{font-weight:700;font-size:13px;color:var(--mu);min-width:52px;text-align:right}
.qtype{margin:20px 0 8px;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.prompt{font-size:23px;font-weight:700;line-height:1.45;margin-bottom:6px}
.prompt .blank{display:inline-block;min-width:64px;border-bottom:3px solid var(--blue);text-align:center;color:var(--blue)}
.prompt .ans{font-size:19px;color:var(--mu);font-weight:600}.prompt .cue{font-size:20px;color:var(--mu)}
.mk{display:inline-block;margin-top:6px;font-size:15px;padding:3px 12px;border-radius:99px}.mk.mk-y{background:#0f2e1c;color:var(--green)}.mk.mk-n{background:#2e1214;color:var(--red)}
.prompt.arq{font-size:27px;text-align:right}
.hint{color:var(--mu);font-size:13px;margin-bottom:16px}.hint.ar{font-size:16px;text-align:right}
.opts{display:flex;flex-direction:column;gap:10px}.opts.grid{display:grid;grid-template-columns:1fr 1fr}
.opt{background:var(--card);border:2px solid var(--line);color:var(--tx);border-radius:16px;padding:14px 16px;font-size:17px;font-weight:600;text-align:left;cursor:pointer}
.opts.grid .opt{text-align:center;font-size:19px}.opt.arx{text-align:right;font-family:Tajawal;font-size:20px;direction:rtl}
.opt:active{transform:scale(.98)}.opt.ok{background:#14532d;border-color:var(--green)}.opt.no{background:#5f1d1d;border-color:var(--red)}.opt[disabled]{cursor:default}
.passage{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:16px;line-height:1.75}.passage summary{font-weight:700;cursor:pointer;color:var(--green)}.passage summary small{color:var(--mu);font-weight:500}.passage .tr summary{color:var(--mu);font-size:15px;text-align:right}.passage .tr p{font-size:16px;text-align:right}
.play{display:flex;gap:10px;margin:6px 0 14px}.pbig{flex:1;border:0;border-radius:18px;padding:18px;font-size:20px;font-weight:800;background:var(--rose);color:#2b0610;cursor:pointer}.pslow{border:0;border-radius:18px;padding:0 20px;font-size:24px;background:var(--card2);cursor:pointer}
.slot{min-height:64px;background:var(--card);border:2px dashed var(--line);border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}.slot.ok{border-style:solid;border-color:var(--green)}.slot.no{border-style:solid;border-color:var(--red)}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:52px}
.tile{background:var(--card2);border:0;border-bottom:3px solid #0b1324;color:var(--tx);border-radius:12px;padding:10px 14px;font-size:18px;font-weight:600;cursor:pointer}.tile.used{visibility:hidden}
.check{width:100%;margin-top:18px;border:0;border-radius:16px;padding:15px;font-size:17px;font-weight:800;background:var(--blue);color:#04121f;cursor:pointer}.check:disabled{opacity:.35}
.fb{position:fixed;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;transform:translateY(110%);transition:transform .25s;z-index:5}
.fb.on{transform:none}.fb.good{background:#0f2e1c;border-top:3px solid var(--green)}.fb.bad{background:#2e1214;border-top:3px solid var(--red)}
.fbi{max-width:640px;margin:0 auto}.fbh{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:19px}
.good .fbh{color:var(--green)}.bad .fbh{color:var(--red)}
.say{background:#ffffff14;border:0;color:var(--tx);border-radius:12px;padding:7px 12px;font-size:15px;cursor:pointer}
.fs{font-size:19px;font-weight:700;margin:8px 0 2px}.fa{font-size:19px;color:#cbd5e1;margin-bottom:4px}
.fe{font-size:13px;color:var(--mu);line-height:1.7}.fe .ar{display:block;font-size:15px}
.next{width:100%;margin-top:12px;border:0;border-radius:16px;padding:14px;font-size:17px;font-weight:800;cursor:pointer}
.good .next{background:var(--green);color:#052e16}.bad .next{background:var(--red);color:#2b0606}
.done{text-align:center;padding:30px 0}.done .score{font-size:64px;font-weight:800}
.stars{font-size:40px;letter-spacing:6px;color:var(--gold);margin:6px 0 10px}.stars i{font-style:normal;color:#334155}.done p{color:var(--mu)}
.foot{color:#475569;text-align:center;font-size:12px;margin-top:26px;line-height:1.8}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-90px);background:var(--green);color:#052e16;font-weight:800;padding:10px 18px;border-radius:99px;transition:.3s;z-index:20}.toast.on{transform:translateX(-50%)}
#loading{text-align:center;padding:80px 20px;color:var(--mu)}#loading b{display:block;font-size:24px;color:var(--tx);margin-bottom:8px}

.prog2{display:flex;align-items:center;gap:10px;margin-bottom:12px}.prog2 .bar{flex:1;height:10px;background:#22304d;border-radius:10px;overflow:hidden}.prog2 .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green))}.prog2 b{font-size:14px}
.cont{width:100%;border:0;border-radius:18px;padding:14px 16px;background:linear-gradient(90deg,#2563eb,#7c3aed);color:#fff;text-align:left;cursor:pointer;margin-bottom:6px}.cont span{display:block;font-weight:800;font-size:17px}.cont small{opacity:.85;font-size:12.5px}
.part{margin-top:22px}.ph{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px;border-left:4px solid var(--c);padding-left:10px}.ph span:first-child{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--c)}.ph b{font-size:18px}.ph .ar{color:var(--mu);font-size:15px}
.ucard{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:0;border-radius:18px;padding:12px 13px;margin-bottom:9px;color:var(--tx);text-align:left;cursor:pointer}.ucard>div{flex:1;min-width:0}.ucard b{display:block;font-size:15px;line-height:1.35}.ucard .ar{display:block;color:var(--mu);font-size:14px;text-align:left}
.ucard .un{flex:none;width:38px;height:38px;border-radius:12px;background:#0e1a30;color:var(--c);display:grid;place-items:center;font-weight:800}.ucard.pass .un{background:var(--green);color:#052e16}
.dots{display:flex;gap:4px;margin-top:6px}.dots i{width:16px;height:5px;border-radius:3px;background:#2a3a5c}.dots i.on{background:var(--c)}
.ucard:active,.step:active,.tools button:active{transform:scale(.98)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tools button{background:var(--card);border:0;border-radius:16px;padding:12px;color:var(--tx);text-align:left;cursor:pointer;font-size:22px}.tools b{display:block;font-size:14px;margin-top:4px}.tools small{color:var(--mu);font-size:11.5px}
.goal{border-left:4px solid var(--blue)}.goal .ar{font-size:16px}
.steps{display:flex;flex-direction:column;gap:9px}.step{display:flex;align-items:center;gap:12px;background:var(--card);border:0;border-radius:18px;padding:12px;color:var(--tx);text-align:left;cursor:pointer;width:100%}.step>div{flex:1}.step b{font-size:16px}.step .ar{color:var(--mu);font-size:14px;margin-left:8px}.step small{display:block;color:#64748b;font-size:12px}
.step .sn{flex:none;width:28px;height:28px;border-radius:9px;background:#0e1a30;display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--blue)}.step.done .sn{background:var(--green);color:#052e16}.step .si{font-size:24px}
.lh{font-size:18px;color:var(--tx);text-transform:none;letter-spacing:0;margin-top:22px}.lh .ar{color:var(--mu);font-size:16px;font-weight:500;margin-left:6px}
h3{font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 8px}
.search{width:100%;background:var(--card);border:2px solid var(--line);border-radius:14px;color:var(--tx);padding:12px 14px;font-size:16px;margin-bottom:12px;font-family:inherit}
textarea{width:100%;min-height:170px;background:#0e1a30;border:2px solid var(--line);border-radius:14px;color:var(--tx);padding:12px;font-size:16px;font-family:Poppins,sans-serif;line-height:1.6}
.chk{font-size:12.5px;color:var(--mu)}
.slot.para,.pool.para{flex-direction:column;align-items:stretch}.pool.para .tile,.slot.para .tile{text-align:left;font-size:15px}
body.inquiz .foot{display:none}
</style>
</head>
<body>
<div class="wrap"><div id="view"><div id="loading"><b>English A1</b>Loading…</div></div></div>
<div class="fb" id="fb"><div class="fbi">
<div class="fbh"><span id="fbt"></span><button class="say" onclick="speak(cur&&(cur.t=='read'?cur.opts[cur.a]:cur.en))">🔊 Listen</button></div>
<div class="fs" id="fbs"></div><div class="fa ar" id="fba"></div><div class="fe" id="fbe"></div>
<button class="next" onclick="nextQ()">Continue</button>
</div></div>
<div class="toast" id="toast">Link copied ✓</div>
<!--SCRIPT-->
</body>
</html>
